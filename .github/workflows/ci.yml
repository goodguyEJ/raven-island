name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # GitHub no longer offers macOS 14 runners, so macOS 14 support is untested here.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: App bundle
        run: ./scripts/build-app.sh
