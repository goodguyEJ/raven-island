name: Release

# Push a tag like v0.1.0 to build a universal app (Apple silicon + Intel), zip it, and publish a
# GitHub Release with the zip and its SHA-256 checksum.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16 (Swift 6)
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
      - name: Unit tests
        run: swift test
      - name: Build universal app
        run: VERSION="${GITHUB_REF_NAME#v}" UNIVERSAL=1 ./scripts/build-app.sh
      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent "Crow's Nest.app" "CrowsNest-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "CrowsNest-${GITHUB_REF_NAME}.zip" > "CrowsNest-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/CrowsNest-${GITHUB_REF_NAME}.zip" "build/CrowsNest-${GITHUB_REF_NAME}.zip.sha256" \
            --title "Crow's Nest ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for what's new and the README for install steps. This build is not notarized: the first time, macOS will ask you to approve it in System Settings → Privacy & Security."
